name: Publish FCM v0.9.0 GitHub Release
on:
  push:
    branches: [main]
    paths:
      - FCM_v090_RELEASE_NOTES.md
      - .github/workflows/publish-v090-release.yml
      - ForeverCharacterManager/FCM-Companion/FCMDataUpdater.ps1
      - ForeverCharacterManager/Core.lua
      - ForeverCharacterManager/Crafting.lua
      - ForeverCharacterManager/Scan.lua
      - ForeverCharacterManager/UI.lua
      - tests/README.md
      - tests/qa_crafting_professions_v090.lua
      - SOURCE_MANIFEST_SHA256.txt
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'PHOENIXHA1735/ForeverCharacterManager'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout updated documentation
        uses: actions/checkout@v4
        with:
          ref: main
          path: docs-current
          persist-credentials: false
      - name: Checkout existing v0.9.0 source tag
        uses: actions/checkout@v4
        with:
          ref: v0.9.0
          path: release-source
          persist-credentials: false
      - name: Package only public addon and companion files
        shell: bash
        run: |
          set -euo pipefail
          cp docs-current/README.md release-source/README.md
          cp docs-current/FCM_v090_RELEASE_NOTES.md release-source/FCM_v090_RELEASE_NOTES.md
          cp docs-current/ForeverCharacterManager/FCM-Companion/ABOUT_DATA_SOURCES.txt release-source/ForeverCharacterManager/FCM-Companion/ABOUT_DATA_SOURCES.txt
          # Apply the tested companion updater hotfix without moving the v0.9.0 tag.
          cp docs-current/ForeverCharacterManager/FCM-Companion/GitHubUpdates.ps1 release-source/ForeverCharacterManager/FCM-Companion/GitHubUpdates.ps1
          # Keep the Windows companion UI text encoding-safe as well.
          cp docs-current/ForeverCharacterManager/FCM-Companion/FCMDataUpdater.ps1 release-source/ForeverCharacterManager/FCM-Companion/FCMDataUpdater.ps1
          # QA3: overlay the validated recipe-profession and blank-skill fixes
          # from main without moving or replacing the original v0.9.0 tag.
          cp docs-current/ForeverCharacterManager/Core.lua release-source/ForeverCharacterManager/Core.lua
          cp docs-current/ForeverCharacterManager/Crafting.lua release-source/ForeverCharacterManager/Crafting.lua
          cp docs-current/ForeverCharacterManager/Scan.lua release-source/ForeverCharacterManager/Scan.lua
          cp docs-current/ForeverCharacterManager/UI.lua release-source/ForeverCharacterManager/UI.lua
          cp docs-current/tests/README.md release-source/tests/README.md
          cp docs-current/tests/qa_crafting_professions_v090.lua release-source/tests/qa_crafting_professions_v090.lua
          cp docs-current/SOURCE_MANIFEST_SHA256.txt release-source/SOURCE_MANIFEST_SHA256.txt
          mkdir -p release-source/docs
          cp docs-current/docs/FOREVERDB_API_KEY_SETUP.md release-source/docs/FOREVERDB_API_KEY_SETUP.md
          cd release-source
          sha256sum -c SOURCE_MANIFEST_SHA256.txt
          if find ForeverCharacterManager -type f \( -iname '*.dpapi' -o -name 'settings.json' -o -name 'reference-cache.json' -o -name 'AHPrices.generated.lua' -o -name 'ExternalData.generated.lua' -o -name 'FCM_DB.lua' \) | grep -q .; then
            echo 'Unsafe personal or generated file found' >&2
            exit 1
          fi
          mkdir -p ../dist
          zip -q -r ../dist/FCM-v0.9.0-Addon-and-Companion.zip ForeverCharacterManager README.md INSTALL_v0.9.0.txt FCM_v090_RELEASE_NOTES.md TEST_REPORT_v0.9.0.txt docs/FOREVERDB_API_KEY_SETUP.md
          # Existing 0.8.x/0.9.0 companions require this exact short asset name.
          # They also reject documentation nested outside ForeverCharacterManager.
          zip -q -r ../dist/FCM-v0.9.0.zip ForeverCharacterManager
          cd ../dist
          sha256sum FCM-v0.9.0-Addon-and-Companion.zip > FCM-v0.9.0-Addon-and-Companion.zip.sha256
          sha256sum FCM-v0.9.0.zip > FCM-v0.9.0.zip.sha256
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import zipfile

          for filename in ('FCM-v0.9.0.zip', 'FCM-v0.9.0-Addon-and-Companion.zip'):
              file = Path(filename)
              assert file.stat().st_size < 15_000_000, filename
              expected = Path(filename + '.sha256').read_text().split()[0]
              assert hashlib.sha256(file.read_bytes()).hexdigest() == expected
              with zipfile.ZipFile(file) as archive:
                  names = [name for name in archive.namelist() if not name.endswith('/')]
                  required = {
                      'ForeverCharacterManager/ForeverCharacterManager.toc',
                      'ForeverCharacterManager/Core.lua',
                      'ForeverCharacterManager/UI.lua',
                      'ForeverCharacterManager/FCM-Companion/FCMDataUpdater.ps1',
                      'ForeverCharacterManager/FCM-Companion/GitHubUpdates.ps1',
                      'ForeverCharacterManager/Media/FCM_Emblem.tga',
                  }
                  assert required.issubset(names), filename
                  assert b'## Version: 0.9.0' in archive.read('ForeverCharacterManager/ForeverCharacterManager.toc')
                  updater = archive.read('ForeverCharacterManager/FCM-Companion/GitHubUpdates.ps1')
                  assert b'-Addon-and-Companion.zip' in updater
                  assert b'docs/FOREVERDB_API_KEY_SETUP.md' in updater
                  companion = archive.read('ForeverCharacterManager/FCM-Companion/FCMDataUpdater.ps1')
                  assert b'Data from ForeverDB.net - https://foreverdb.net' in companion
                  for name in names:
                      assert '..' not in name and ':' not in name and not name.startswith(('/', './')), name
                      if name.startswith('ForeverCharacterManager/'):
                          assert all(part.replace('.', '').replace('-', '').replace('_', '').isalnum() for part in name.split('/')), name
                      elif name == 'docs/FOREVERDB_API_KEY_SETUP.md':
                          assert filename.endswith('-Addon-and-Companion.zip'), name
                      else:
                          assert '/' not in name, name
                  if filename == 'FCM-v0.9.0.zip':
                      assert all(name.startswith('ForeverCharacterManager/') for name in names)
          PY
      - name: Create or update public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.9.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v0.9.0 --repo "$GITHUB_REPOSITORY" --title "Forever Character Manager v0.9.0 - Consolidated Release" --notes-file docs-current/FCM_v090_RELEASE_NOTES.md
            gh release upload v0.9.0 dist/FCM-v0.9.0-Addon-and-Companion.zip dist/FCM-v0.9.0-Addon-and-Companion.zip.sha256 dist/FCM-v0.9.0.zip dist/FCM-v0.9.0.zip.sha256 --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v0.9.0 dist/FCM-v0.9.0-Addon-and-Companion.zip dist/FCM-v0.9.0-Addon-and-Companion.zip.sha256 dist/FCM-v0.9.0.zip dist/FCM-v0.9.0.zip.sha256 --repo "$GITHUB_REPOSITORY" --title "Forever Character Manager v0.9.0 - Consolidated Release" --notes-file docs-current/FCM_v090_RELEASE_NOTES.md --verify-tag
          fi
