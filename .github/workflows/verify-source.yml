name: Verify FCM source
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
      - name: Validate Lua syntax
        run: |
          find ForeverCharacterManager -name '*.lua' -type f -print0 | xargs -0 -r luac5.1 -p
      - name: Validate TOC manifests and absence of local saves
        shell: python
        run: |
          from pathlib import Path
          root=Path('ForeverCharacterManager')
          for toc in root.glob('*.toc'):
              for line in toc.read_text(encoding='utf-8').splitlines():
                  line=line.strip()
                  if not line or line.startswith('##'): continue
                  if line.lower()=='externaldata.generated.lua': continue
                  assert (root / line).is_file(), f'{toc.name} refers to missing file: {line}'
          for pattern in ('**/ExternalData.generated.lua','**/SavedVariables/**','**/.env'):
              assert not list(Path('.').glob(pattern)), f'Sensitive/generated path matched {pattern}'
