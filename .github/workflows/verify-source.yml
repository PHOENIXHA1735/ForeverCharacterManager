name: Verify FCM source
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
      - name: Validate Lua 5.1 syntax
        run: |
          find ForeverCharacterManager -name '*.lua' -type f -print0 | xargs -0 -r luac5.1 -p
      - name: Run every Lua 5.1 regression suite and report all failures
        shell: bash
        run: |
          failures=0
          for suite in tests/qa_*.lua; do
            echo "::group::$suite"
            if lua5.1 "$suite"; then
              echo "PASS: $suite"
            else
              echo "::error title=FCM regression failure::$suite"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done
          if [ "$failures" -ne 0 ]; then
            echo "::error::$failures Lua 5.1 regression suite(s) failed"
            exit 1
          fi
          echo "All Lua 5.1 regression suites passed"
      - name: Validate overnight catalog schedule safeguards
        if: success() || failure()
        run: python3 tests/qa_overnight_catalog.py
      - name: Validate private history and Gold Advisor using synthetic data
        if: success() || failure()
        run: |
          python3 tests/check_private_paths.py
          python3 tests/qa_ah_history.py
          lua5.1 tests/qa_gold_advisor.lua
      - name: Validate offline Gathering reference staging
        if: success() || failure()
        run: python3 tests/qa_gather_reference_import.py
      - name: Validate the Public30 publisher through Gold Advisor
        run: python3 tests/qa_public30_pipeline.py
      - name: Validate public gathering snapshot schema
        if: success() || failure()
        shell: python
        run: |
          import json
          from pathlib import Path
          root=Path('CommunityData')
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert manifest['schema']==1 and isinstance(manifest['version'],int) and manifest['version']>=1
          allowed={'kind','mapID','x','y','name'}
          for kind in ('herbalism','mining','fishing','treasure'):
              data=json.loads((root/(kind+'.json')).read_text(encoding='utf-8'))
              assert data['schema']==1
              for n in data['nodes']:
                  assert set(n)==allowed and n['kind']==kind
                  assert isinstance(n['mapID'],int) and 1<=n['mapID']<=200000
                  assert all(isinstance(n[k],int) and 0<=n[k]<=10000 for k in ('x','y'))
                  assert isinstance(n['name'],str) and 2<=len(n['name'])<=100
      - name: Validate TOC manifests and absence of local saves
        if: success() || failure()
        shell: python
        run: |
          from pathlib import Path
          root=Path('ForeverCharacterManager')
          for toc in root.glob('*.toc'):
              for line in toc.read_text(encoding='utf-8').splitlines():
                  line=line.strip()
                  if not line or line.startswith('##'): continue
                  if line.lower() in ('externaldata.generated.lua', 'ahprices.generated.lua', 'ahhistory.generated.lua'): continue
                  assert (root / line).is_file(), f'{toc.name} refers to missing file: {line}'
          for pattern in ('**/ExternalData.generated.lua','**/AHPrices.generated.lua','**/SavedVariables/**','**/.env','**/foreverdb-request-budget.json','**/foreverdb-request-backoff.json'):
              assert not list(Path('.').glob(pattern)), f'Sensitive/generated path matched {pattern}'

  windows-companion:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local AH history retention and provider-table opt-in (PowerShell 5.1)
        shell: powershell
        run: .\tests\qa_ah_archive.ps1
      - name: Validate companion quota ledger (PowerShell 5.1)
        shell: powershell
        run: .\ForeverCharacterManager\FCM-Companion\Test-FCMQuotaLedger.ps1
      - name: Set up Python for offline Gathering importer
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Gathering reference refresh (PowerShell 5.1)
        shell: powershell
        run: .\tests\qa_gather_sync.ps1
      - name: Verify transactional reference publication (PowerShell 5.1)
        shell: powershell
        run: .\tests\qa_reference_publication.ps1
      - name: Verify Public30 publication (PowerShell 5.1)
        shell: powershell
        run: |
          python -m pip install tzdata==2025.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/qa_public30_pipeline.py PublisherTests.test_windows_publication_and_preservation
